spring.application.name=reassignment-engine

# H2 Database
spring.datasource.url=jdbc:h2:mem:ziprun
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging - access at /h2-console)
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# ===== LLM Configuration =====
# Provider: gemini | openai | groq | ollama
llm.provider=openai

# API Key (set via environment variable LLM_API_KEY)
llm.api-key=${LLM_API_KEY:default-api-key}

# Model name (gpt-4o, gpt-4-turbo, gpt-3.5-turbo)
llm.model=gpt-4o

# Base URL for API
llm.base-url=https://api.openai.com

# Timeout in milliseconds
llm.timeout-ms=10000

# ===== Redis Configuration =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms

# ===== Suggestion Stream Configuration =====
suggestion.stream.redis-ttl-minutes=30
suggestion.stream.reconnect-buffer-size=100
